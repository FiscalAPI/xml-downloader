name: Publish NuGet Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Trusted Publishing: token OIDC que nuget.org canjea por una llave temporal

    steps:
    # Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # Setup .NET (SDK 10 builds all TFMs: net8.0, net9.0, net10.0)
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # Restore dependencies
    - name: Restore dependencies
      run: dotnet restore

    # Step to extract the AssemblyVersion from the .csproj file
    - name: Extract Package Version
      id: get_version
      run: |
        version=$(grep -oPm1 "(?<=<Version>)[^<]+" $(find . -name "*.csproj"))
        echo "PACKAGE_VERSION=$version" >> $GITHUB_ENV
        echo "Package Version extracted: $version"

    # Build the project
    - name: Build the project
      run: dotnet build --configuration Release

    # Pack the NuGet package
    - name: Pack NuGet Package
      run: dotnet pack --configuration Release --output ./nupkg

    # Llave temporal (1 h) de la política de Trusted Publishing de la cuenta Fiscalapi
    - name: NuGet login (OIDC)
      id: login
      uses: NuGet/login@v1
      with:
        user: Fiscalapi

    # Publish the package to NuGet
    - name: Publish to NuGet
      run: |
        dotnet nuget push ./nupkg/*.nupkg \
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json
